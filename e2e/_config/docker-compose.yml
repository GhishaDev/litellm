# E2E docker-compose. Builds litellm proxy from the local source tree
# (so unreleased fixes on the current branch are exercised), exposes /metrics
# on port 4011 to avoid colliding with a developer's regular proxy on 4000,
# forwards real provider API keys from `e2e/.env`, and runs an ephemeral
# Postgres so virtual-key / team / spend-log features can be exercised.
#
# Postgres is INTENTIONALLY ephemeral — no named volume — so each
# `e2e/tools/proxy restart` wipes accumulated test data. To persist data
# across restarts, add a `volumes:` declaration manually (not recommended
# for test runs: stale virtual keys + spend logs poison later cases).
#
# Run via `e2e/tools/proxy {start|stop|status|logs|rebuild}` — not `docker
# compose` directly — so behavior stays consistent across machines.

services:
  db:
    image: postgres:16-alpine
    container_name: litellm-e2e-db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: e2e-test-only-not-a-secret
    # No `ports:` — Postgres is only reachable inside the compose network.
    # No `volumes:` — ephemeral by design.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    restart: "no"

  # Optional zero-cost provider — does NOT start unless `--profile mock` is set.
  # Mounts mock_provider.py (stdlib HTTP server) and exposes:
  #   POST /v1/chat/completions    OpenAI-shape (stream + non-stream)
  #   POST /v1/messages            Anthropic-shape (stream + non-stream)
  #   POST /api/public/ingestion   Langfuse-style callback sink
  #   POST /api/hooks/*            GenericAPILogger callback sink
  # Behavior controlled via env vars in the compose project's .env or shell:
  #   MOCK_TTFT_MS    delay before first chunk (default 0)
  #   MOCK_TPS        chunks per second when streaming (default 100)
  #   MOCK_CHUNKS     total chunks per streamed response (default 100)
  #   MOCK_CALLBACK_DELAY  seconds the callback sinks sleep before responding (0)
  #   MOCK_FAIL_RATE  0..1 fraction of provider calls returning 503 (default 0)
  # See e2e/_config/mock_provider.py header for the full request-time override
  # protocol (each request can also override these per-call via JSON fields).
  mock:
    image: python:3.13-slim
    container_name: litellm-e2e-mock
    command: ["python", "/mock/mock_provider.py"]
    volumes:
      - ./mock_provider.py:/mock/mock_provider.py:ro
    environment:
      MOCK_TTFT_MS: "${MOCK_TTFT_MS:-0}"
      MOCK_TPS: "${MOCK_TPS:-100}"
      MOCK_CHUNKS: "${MOCK_CHUNKS:-100}"
      CALLBACK_DELAY: "${MOCK_CALLBACK_DELAY:-0}"
      FAIL_RATE: "${MOCK_FAIL_RATE:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=1).status==200 else 1)"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    profiles: ["mock"]
    restart: "no"

  litellm:
    build:
      context: ../..              # repo root — picks up local source changes
      dockerfile: Dockerfile
    image: litellm-e2e:local
    container_name: litellm-e2e
    ports:
      - "127.0.0.1:4011:4000"
    environment:
      LITELLM_MASTER_KEY: "sk-e2e-test"
      LITELLM_LOG: "WARNING"
      # Match the user's production env: force using the locally-bundled
      # model_prices JSON instead of fetching the latest from GitHub.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # DB wiring — litellm runs `prisma migrate deploy` on startup against
      # this URL. Compose-network DNS resolves `db` to the postgres container.
      DATABASE_URL: "postgresql://litellm:e2e-test-only-not-a-secret@db:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      # Speed up the budget-reset background job so e2e cases can verify
      # it within a single test run. Upstream default is ~600 s (10 min);
      # for dev/e2e there's no cost reason to wait that long, and Case 16
      # (`reset_budget_windows` regression for BerriAI/litellm#26346) needs
      # at least one tick to land inside its observation window.
      PROXY_BUDGET_RESCHEDULER_MIN_TIME: "10"
      PROXY_BUDGET_RESCHEDULER_MAX_TIME: "15"
      # Forwarded from e2e/.env via `env_file`
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Optional provider base URLs (gateway / Azure / self-hosted endpoints).
      # Blank = use provider default (Anthropic / OpenAI fallback chains
      # treat empty string as "use default", so forwarding "" is safe here.)
      ANTHROPIC_API_BASE: "${ANTHROPIC_API_BASE:-}"
      OPENAI_API_BASE: "${OPENAI_API_BASE:-}"
    env_file:
      - path: ../.env
        required: false
    volumes:
      # Rendered at proxy-start time by `e2e/tools/proxy` from .env values.
      # See ../tools/proxy `render_config()`. The file is gitignored.
      - ./.litellm.rendered.yaml:/app/config.yaml:ro
    command:
      - --config=/app/config.yaml
      - --port=4000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health/liveliness comes for free without DB / provider connectivity,
      # but readiness needs migrations to finish — give it more time.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 5s
      timeout: 3s
      retries: 24                # 24*5s = 2 min; covers prisma migrate cold start
      start_period: 30s
    restart: "no"
